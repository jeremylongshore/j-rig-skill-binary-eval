name: Lint (YAML + Actions)

# Deterministic L1 lint for the CI-config surface: yamllint + actionlint.
# ESLint/Prettier run inside ci.yml (`pnpm run check` + the prettier format gate);
# markdownlint runs in doc-quality.yml (its single home — de-duplicated from here).
# These two jobs are REQUIRED, not advisory: a green required check is signal, a
# red advisory check is noise. yamllint runs --strict so warnings fail the gate.
#
# Configs are vendored so the policy travels with the repo:
#   - YAML:    .yamllint.yaml (extends .audit-harness/configs/yamllint.yaml)
#   - Actions: actionlint (built-in rule set)

on:
  # No `branches:` filter on purpose. With `branches: [main]` a stacked PR whose
  # base is another feature branch got NO checks at all, so a whole stack could
  # only be validated after each predecessor merged and the next was retargeted.
  # Push builds stay limited to main.
  pull_request:
  push:
    branches: [main]
    paths:
      - "**/*.yml"
      - "**/*.yaml"

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install yamllint
        run: pip install --no-cache-dir "yamllint==1.35.1"

      - name: Run yamllint (--strict — warnings fail the gate)
        run: |
          yamllint --strict \
            --config-file .yamllint.yaml \
            .github/ codecov.yml

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint workflow YAML with rhysd/actionlint
        uses: reviewdog/action-actionlint@2085657ab2c7f48c58edcc767fba576f63bea76b # v1.77.0
        with:
          reporter: github-pr-check
          level: error
          fail_level: error
