name: Typos

on:
  # No `branches:` filter on purpose. With `branches: [main]` a stacked PR whose
  # base is another feature branch got NO checks at all, so a whole stack could
  # only be validated after each predecessor merged and the next was retargeted.
  # Push builds stay limited to main.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: typos-${{ github.ref }}
  cancel-in-progress: true

# REQUIRED gate: a spelling hit reds the PR. Legitimate domain vocabulary is
# allow-listed in .typos.toml (extend-words / extend-exclude), NOT silenced
# wholesale. A green required check is signal; a red advisory check is noise.
jobs:
  typos:
    name: typos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Spell-check with crate-ci/typos
        uses: crate-ci/typos@v1.50.2
