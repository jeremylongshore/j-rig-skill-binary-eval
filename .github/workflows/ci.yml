name: CI

on:
  push:
    branches: [main]
  # No `branches:` filter on purpose. With `branches: [main]` a stacked PR whose
  # base is another feature branch got NO checks at all, so a whole stack could
  # only be validated after each predecessor merged and the next was retargeted.
  # Push builds stay limited to main.
  pull_request:

permissions:
  contents: read

# Only superseded PR validation is disposable. Keep every main/scheduled run
# independent so evidence for distinct commits is never canceled or replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: |
            pnpm-lock.yaml
            ci/emit-evidence/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check (Prettier)
        run: pnpm run format:check

      # ci/emit-evidence is a standalone (non-workspace) package that only the
      # nightly installs, after 10-50 minutes of evals. A package.json pin bump
      # without a matching lockfile (#247) passed every PR check and broke the
      # nightly for 16 nights. Install it frozen here, and run its kernel
      # self-check, so that drift fails the PR instead.
      - name: Emit-evidence standalone lockfile + kernel self-check
        run: |
          set -euo pipefail
          (cd ci/emit-evidence && pnpm install --frozen-lockfile --ignore-workspace)
          node --experimental-strip-types ci/emit-evidence/emit-evidence.ts --self-check
          pnpm exec vitest run scripts/canonical-payload.test.ts

      - name: Typecheck dashboard emitters and cross-kernel contracts
        # This is intentionally a standalone file-list compilation with all
        # options supplied here. TS6 requires that choice to be explicit.
        run: >
          pnpm exec tsc --ignoreConfig --types node --noEmit --target ES2022 --module NodeNext
          --moduleResolution NodeNext --strict --skipLibCheck --allowImportingTsExtensions
          scripts/emit-evidence.ts scripts/assemble-manifest.ts
          ci/emit-evidence/emit-evidence.ts ci/emit-evidence/assemble-manifest.ts
          scripts/canonical-payload.test.ts

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Typecheck workspace verification
        run: pnpm run typecheck:workspace

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: |
            pnpm-lock.yaml
            ci/emit-evidence/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install standalone nightly kernel for payload contracts
        working-directory: ci/emit-evidence
        run: pnpm install --frozen-lockfile --ignore-workspace

      # Test-only immutable consumer fixture, not a production Action adoption.
      - name: Checkout reviewed enforcing verifier fixture
        uses: actions/checkout@v7
        with:
          repository: jeremylongshore/intent-rollout-gate
          ref: 9e0cfa3e8e428d4fde14760a05945ccb39722b24
          path: .ci-verifier-fixture
          sparse-checkout: |
            dist/index.js
            package.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Verify exact consumer artifact and offline producer interoperability
        working-directory: ci/emit-evidence
        env:
          ROLLOUT_GATE_DIST: ${{ github.workspace }}/.ci-verifier-fixture/dist/index.js
        run: |
          expected='bd9287783b3e685829e1a20b8508a5f185c89cd340d9d4e7285a42dbbf2dd047'
          printf '%s  %s\n' "$expected" "$ROLLOUT_GATE_DIST" | sha256sum --check
          pnpm run typecheck:signing
          pnpm run test:signing

      # Enforcement wall: the vendored audit-harness wrapper verifies the
      # hash-pinned policy surface (the coverage floor in vitest.config.ts). A
      # silent threshold downgrade trips HARNESS_TAMPERED (exit 2) and reds CI.
      - name: Audit-harness version (smoke)
        run: scripts/audit-harness --version

      - name: Audit-harness verify (hash-pinned policy artifacts)
        run: pnpm run harness:verify

      - name: Workspace architecture, bias inventory and Gherkin applicability
        run: pnpm run verify:workspace

      - name: Build
        run: pnpm run build

      # test:coverage enforces the ratchet-from-here coverage floor declared in
      # vitest.config.ts (thresholds block). Floor is the measured baseline
      # rounded down — green today, can only ratchet up.
      - name: Test (with coverage floor enforced)
        run: pnpm run test:coverage

      # Per-package coverage gate for @intentsolutions/refiner-core (bd_000-projects-214c.4).
      # Scoped to refiner-core sources only, so a refiner-core regression reds the
      # PR even when masked/diluted in the global floor above. Floor is >= 80% on
      # every dimension per the bead (current measured: 96.64% lines, 90.83%
      # branches, 100% functions). The scoped vitest.config.ts is hash-pinned in
      # .harness-hash-extra-patterns, so a silent downgrade trips HARNESS_TAMPERED.
      - name: Test (refiner-core per-package coverage gate)
        run: pnpm run test:coverage:refiner-core

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/coverage-final.json
          flags: typescript
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Set up Node.js 20 for workspace compatibility
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20.20.2"

      - name: Workspace verification on Node.js 20
        run: |
          pnpm exec vitest run scripts/workspace-architecture.test.ts scripts/workspace-quality.test.ts
          pnpm run verify:workspace

  otel-smoke:
    name: OTel emission smoke (iaj-E08)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # End-to-end smoke: a full eval (stub providers, J_RIG_OTEL=1) must emit
      # every event name the 067 runtime-event taxonomy binds j-rig to emit,
      # each carrying eval.run_id (067 § 4.2). Guards the cross-emitter pin
      # (Gregg finding #2) so a name regression reds CI rather than drifting
      # silently from the audit-harness iah-E07 emitter.
      - name: OTel emission smoke
        run: bash scripts/otel-smoke.sh
